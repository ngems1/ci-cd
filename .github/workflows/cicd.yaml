# ============================================================
# GitHub Actions - Standard Enterprise CI/CD Pipeline
# File: .github/workflows/deploy.yml
# ============================================================

name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - dev

  pull_request:
    types:
      - closed
    branches:
      - stage
      - prod

# -------------------------------------------------------------
# REQUIRED FOR OIDC: Grant write permissions for OIDC token
# -------------------------------------------------------------
permissions:
  id-token: write   # Required to request JWT token from GitHub OIDC
  contents: read    # Required to checkout repository code
  pull-requests: write

env:
  APP_NAME: my-application

jobs:
  # -------------------------------------------------------------
  # JOB 1: Detect Environment
  # -------------------------------------------------------------
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect Target Environment
        id: detect
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "stage" ]]; then
            echo "environment=stage" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "prod" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          fi

  # -------------------------------------------------------------
  # JOB 2: Build Application & Upload to AWS S3 via OIDC
  # -------------------------------------------------------------
  build:
    name: Build Application
    needs: detect-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          echo "Building Docker image for environment: ${{ needs.detect-environment.outputs.environment }}"
          docker build -t ${{ env.APP_NAME }}:${{ github.sha }} -f dockerfile .

      - name: Export Docker Image to Tarball
        run: |
          mkdir -p build-output
          docker save ${{ env.APP_NAME }}:${{ github.sha }} -o build-output/${{ env.APP_NAME }}-${{ github.sha }}.tar

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Image Tarball to AWS S3
        run: |
          TARGET_ENV="${{ needs.detect-environment.outputs.environment }}"
          IMAGE_FILE="${{ env.APP_NAME }}-${{ github.sha }}.tar"
          
          echo "Uploading ${IMAGE_FILE} to s3://${{ vars.S3_BUCKET_NAME }}/${TARGET_ENV}/"
          aws s3 cp build-output/${IMAGE_FILE} s3://${{ vars.S3_BUCKET_NAME }}/${TARGET_ENV}/${IMAGE_FILE}

  # -------------------------------------------------------------
  # JOB 3: Testing Stage
  # -------------------------------------------------------------
  test:
    name: Execute Tests
    needs: [detect-environment, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Run Tests
        run: |
          npm ci
          npm test --if-present

  # -------------------------------------------------------------
  # JOB 4: Deployment
  # -------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [detect-environment, test]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying ${{ env.APP_NAME }} to target environment: ${{ needs.detect-environment.outputs.environment }}"

  # -------------------------------------------------------------
  # JOB 5: Notification Job
  # -------------------------------------------------------------
  notify:
    name: Notify Team
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Status
        run: |
          echo "Sending deployment notification..."
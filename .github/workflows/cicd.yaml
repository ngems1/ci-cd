# ============================================================
# GitHub Actions - S3 Upload Pipeline
# File: .github/workflows/cicd.yaml
# ============================================================

name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - dev

  pull_request:
    types:
      - closed
    branches:
      - stage
      - prod

# -------------------------------------------------------------
# REQUIRED FOR OIDC: Grant write permissions for OIDC token
# -------------------------------------------------------------
permissions:
  id-token: write
  contents: read

env:
  APP_NAME: my-application

jobs:
  # -------------------------------------------------------------
  # JOB 1: Detect Environment
  # -------------------------------------------------------------
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}

    steps:
      - name: Detect Target Environment
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.pull_request.base.ref }}" == "stage" ]]; then
            echo "environment=stage" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.pull_request.base.ref }}" == "prod" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to determine deployment environment."
            exit 1
          fi

  # -------------------------------------------------------------
  # JOB 2: Build Application Tarball & Upload to AWS S3 via OIDC
  # -------------------------------------------------------------
  build-and-upload:
    name: Build & Upload Artifact to S3
    needs: detect-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ env.APP_NAME }}:${{ github.sha }}" \
            -f dockerfile .

      - name: Export Docker Image to Tarball
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build-output

          docker save \
            "${{ env.APP_NAME }}:${{ github.sha }}" \
            -o "build-output/${{ env.APP_NAME }}-${{ github.sha }}.tar"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Image Tarball to AWS S3
        env:
          TARGET_ENV: ${{ needs.detect-environment.outputs.environment }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_FILE="${APP_NAME}-${GITHUB_SHA}.tar"
          SOURCE_FILE="build-output/${IMAGE_FILE}"

          # Clean bucket name string
          BUCKET_NAME="$(printf '%s' "$S3_BUCKET_NAME" | xargs)"
          BUCKET_NAME="${BUCKET_NAME#s3://}"
          BUCKET_NAME="${BUCKET_NAME%/}"

          DESTINATION="s3://${BUCKET_NAME}/${TARGET_ENV}/${IMAGE_FILE}"

          echo "Uploading ${SOURCE_FILE} to ${DESTINATION}"
          aws s3 cp "$SOURCE_FILE" "$DESTINATION"